# Drop-in for an existing polytype.service running as User=polytype.
[Unit]
Wants=openbao.service
After=openbao.service

[Service]
Type=exec
WorkingDirectory=/opt/polytype
ExecStart=
ExecStart=/usr/bin/node /opt/polytype/server.mjs
# Clear the previous file-rendering integration. Preserve unrelated credentials
# and ExecStartPre commands here if your existing service needs them.
LoadCredential=
ExecStartPre=
RuntimeDirectory=
UnsetEnvironment=POLYTYPE_ADMIN_KEY POLYTYPE_ADMIN_KEY_FILE
EnvironmentFile=/etc/polytype/openbao/app.env
PassEnvironment=POLYTYPE_OPENBAO_SECRET_ID
Environment=POLYTYPE_ADMIN_SECURE_COOKIE=true
UMask=0077
LimitCORE=0
MemorySwapMax=0
# A fresh single-use SecretID must be supplied for every activation.
Restart=no
